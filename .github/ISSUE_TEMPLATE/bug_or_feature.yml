name: Bug or feature
description: Report a bug or request a change
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Please read [NOTICE.md](https://github.com/HarshShah0203/Scrub/blob/main/NOTICE.md). Only share synthetic samples you own.
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - Bug
        - Feature
        - Docs
        - Packaging
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What happened, what you expected, OS, and UI (Tk or Gradio) if relevant.
    validations:
      required: true
